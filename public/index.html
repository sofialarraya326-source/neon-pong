<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>🏓 Neon Pong</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #162033 0%,
                    #080b12 50%,
                    #030408 100%
                );

            overflow: hidden;
        }

        button {
            border: none;
            border-radius: 14px;

            padding: 14px 25px;

            font-size: 16px;
            font-weight: bold;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #00bcd4,
                    #7c4dff
                );

            cursor: pointer;

            transition: .15s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(124,77,255,.35);
        }

        button:active {
            transform: scale(.97);
        }

        /* =========================
           MENÚ
        ========================= */

        #menu {
            position: relative;
            z-index: 50;

            width: min(92vw, 520px);
            max-height: 94vh;
            margin: auto;

            overflow-y: auto;

            padding: 30px;

            text-align: center;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,.5);
        }

        .logo {
            font-size: 55px;
        }

        h1 {
            margin: 0;

            font-size:
                clamp(30px, 7vw, 50px);

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #7c4dff,
                    #ff4081
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .subtitle {
            color: #9aa4b2;
            margin: 10px 0 25px;
        }

        /* =========================
           CAMPOS
        ========================= */

        input {
            position: relative;
            z-index: 60;

            width: 100%;

            padding: 14px;

            margin: 7px 0;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,.15);

            background:
                rgba(0,0,0,.35);

            color: white;

            font-size: 16px;

            outline: none;
        }

        input::placeholder {
            color: #737d8c;
        }

        /* =========================
           BOTONES DE PARTIDA
        ========================= */

        .room-buttons {
            position: relative;
            z-index: 60;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 10px;
        }

        .room-buttons button {
            padding: 13px 8px;
        }

        #bot-button {
            grid-column: span 2;
            margin-top: 10px;
            background: linear-gradient(135deg, #7c4dff, #ff4081);
        }

        /* =========================
           CÓDIGO
        ========================= */

        #room-code-box {
            display: none;

            margin-top: 18px;

            padding: 18px;

            border-radius: 16px;

            background:
                rgba(0,229,255,.07);

            border:
                1px solid
                rgba(0,229,255,.2);
        }

        #room-code {
            font-size: 38px;

            font-weight: bold;

            letter-spacing: 8px;

            color: #00e5ff;

            margin: 8px 0;
        }

        .copy-button {
            background:
                rgba(255,255,255,.08);

            border:
                1px solid
                rgba(255,255,255,.15);

            padding: 9px 15px;

            font-size: 13px;
        }

        #message {
            margin-top: 18px;

            min-height: 20px;

            color: #9aa4b2;

            font-size: 14px;
        }

        /* =========================
           JUEGO
        ========================= */

        #game {
            display: none;

            position: relative;
            z-index: 1;

            width: 100vw;
            height: 100vh;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            padding: 10px;
        }

        .game-top {
            width: min(94vw, 900px);

            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 8px;
        }

        .player-name {
            font-weight: bold;

            max-width: 35vw;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .player-one {
            color: #00e5ff;
        }

        .player-two {
            color: #ff4081;
        }

        .score {
            font-size:
                clamp(25px, 6vw, 45px);

            font-weight: bold;
        }

        /* =========================
           CANCHA
        ========================= */

        #canvas {
            width:
                min(
                    94vw,
                    calc(100vh - 115px),
                    900px
                );

            max-height:
                calc(100vh - 115px);

            height: auto;

            aspect-ratio: 16 / 10;

            background: #05070c;

            border-radius: 18px;

            border:
                1px solid
                rgba(255,255,255,.12);

            box-shadow:
                0 0 60px
                rgba(0,229,255,.08);

            touch-action: none;
        }

        /* =========================
           ESPERANDO
        ========================= */

        #waiting {
            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            background:
                rgba(3,4,8,.9);

            backdrop-filter: blur(10px);

            z-index: 100;
        }

        .wait-box {
            text-align: center;

            padding: 35px;

            width: min(88vw,400px);

            border-radius: 25px;

            background: #10141d;

            border:
                1px solid
                rgba(255,255,255,.1);
        }

        .loader {
            width: 45px;
            height: 45px;

            margin: 0 auto 20px;

            border:
                4px solid
                rgba(255,255,255,.1);

            border-top-color:
                #00e5ff;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           CONTROLES TÁCTILES
        ========================= */

        .touch-area {
            position: fixed;

            top: 0;
            bottom: 0;

            width: 50%;

            display: none;

            z-index: 10;

            pointer-events: none;

            touch-action: none;
        }

        #touch-left {
            left: 0;
        }

        #touch-right {
            right: 0;
        }

        .touch-info {
            position: fixed;

            bottom: 8px;
            left: 50%;

            transform:
                translateX(-50%);

            color:
                rgba(255,255,255,.45);

            font-size: 12px;

            pointer-events: none;

            z-index: 15;
        }

        /* =========================
           GAME OVER
        ========================= */

        #game-over {
            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            background:
                rgba(0,0,0,.75);

            z-index: 200;
        }

        .game-over-box {
            text-align: center;

            padding: 40px;

            background: #10141d;

            border-radius: 25px;

            border:
                1px solid
                rgba(255,255,255,.12);
        }

        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 700px) {

            body {
                overflow: hidden;
            }

            #menu {
                padding: 22px;
            }

            .logo {
                font-size: 45px;
            }

            .room-buttons {
                grid-template-columns: 1fr;
            }

            #room-code {
                font-size: 32px;
            }

            #game {
                padding: 5px;
            }

            .game-top {
                margin-bottom: 5px;
            }

            #canvas {
                width: 96vw;

                max-height:
                    calc(100vh - 90px);
            }

            .touch-area {
                display: block;
            }

            .touch-info {
                display: block;
            }
        }

        @media (min-width: 701px) {

            .touch-info {
                display: none;
            }
        }

    </style>

</head>

<body>

    <!-- =========================
         MENÚ
    ========================= -->

    <div id="menu">

        <div class="logo">
            🏓
        </div>

        <h1>
            NEON PONG
        </h1>

        <div class="subtitle">
            Creá una partida o jugá contra el bot
        </div>

        <input
            id="name"
            maxlength="15"
            placeholder="Tu nombre"
            autocomplete="off"
        >

        <input
            id="code"
            maxlength="4"
            placeholder="CÓDIGO DE PARTIDA"
            autocomplete="off"
            style="text-transform:uppercase;"
        >

        <div class="room-buttons">

            <button id="create">
                🆕 CREAR PARTIDA
            </button>

            <button id="join">
                🎮 UNIRSE
            </button>

            <button id="bot-button">
                🤖 JUGAR CONTRA BOT
            </button>

        </div>

        <div id="room-code-box">

            <div>
                Compartí este código:
            </div>

            <div id="room-code">
                ----
            </div>

            <button
                class="copy-button"
                id="copy"
            >
                📋 COPIAR CÓDIGO
            </button>

        </div>

        <div id="message"></div>

    </div>


    <!-- =========================
         JUEGO
    ========================= -->

    <div id="game">

        <div class="game-top">

            <div
                class="player-name player-one"
                id="player1-name"
            >
                JUGADOR 1
            </div>

            <div
                class="score"
                id="score"
            >
                0 — 0
            </div>

            <div
                class="player-name player-two"
                id="player2-name"
            >
                JUGADOR 2
            </div>

        </div>

        <canvas
            id="canvas"
            width="800"
            height="500"
        ></canvas>

        <div class="touch-info">
            📱 Arrastrá el dedo sobre tu lado de la cancha para mover la paleta
        </div>

    </div>


    <!-- Áreas táctiles -->

    <div
        id="touch-left"
        class="touch-area"
    ></div>

    <div
        id="touch-right"
        class="touch-area"
    ></div>


    <!-- =========================
         ESPERANDO
    ========================= -->

    <div id="waiting">

        <div class="wait-box">

            <div class="loader"></div>

            <h2>
                Esperando al otro jugador...
            </h2>

            <p id="waiting-text">
                Compartí el código de partida.
            </p>

        </div>

    </div>


    <!-- =========================
         GAME OVER
    ========================= -->

    <div id="game-over">

        <div class="game-over-box">

            <h1 id="winner-text">
                🏆
            </h1>

            <p>
                La partida terminó.
            </p>

        </div>

    </div>


    <!-- =========================
         SOCKET.IO
    ========================= -->

    <script src="/socket.io/socket.io.js"></script>

    <script>

        /* =========================
           ELEMENTOS
        ========================= */

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const menu =
            document.getElementById("menu");

        const game =
            document.getElementById("game");

        const waiting =
            document.getElementById("waiting");

        const nameInput =
            document.getElementById("name");

        const codeInput =
            document.getElementById("code");

        const createButton =
            document.getElementById("create");

        const joinButton =
            document.getElementById("join");

        const botButton =
            document.getElementById("bot-button");

        const message =
            document.getElementById("message");

        const roomCodeBox =
            document.getElementById("room-code-box");

        const roomCodeElement =
            document.getElementById("room-code");

        const waitingText =
            document.getElementById("waiting-text");

        const scoreElement =
            document.getElementById("score");

        const player1Name =
            document.getElementById("player1-name");

        const player2Name =
            document.getElementById("player2-name");

        const gameOver =
            document.getElementById("game-over");

        const winnerText =
            document.getElementById("winner-text");

        const touchLeft =
            document.getElementById("touch-left");

        const touchRight =
            document.getElementById("touch-right");

        const copyButton =
            document.getElementById("copy");


        /* =========================
           VARIABLES
        ========================= */

        let socket = null;
        let myPlayer = null;
        let roomCode = null;
        let myName = "";
        let isBotMode = false;

        let state = {

            player1: false,
            player2: false,

            name1: "",
            name2: "",

            paddle1Y: 200,
            paddle2Y: 200,

            ballX: 400,
            ballY: 250,

            ballDX: 6,
            ballDY: 6,

            score1: 0,
            score2: 0,

            running: false

        };


        /* =========================
           ACTIVAR CONTROLES TÁCTILES
        ========================= */

        function enableTouchControls() {

            touchLeft.style.pointerEvents =
                "none";

            touchRight.style.pointerEvents =
                "none";

            if (myPlayer === 1 || isBotMode) {

                touchLeft.style.pointerEvents =
                    "auto";

            }

            if (myPlayer === 2 && !isBotMode) {

                touchRight.style.pointerEvents =
                    "auto";

            }

        }


        /* =========================
           CONECTAR
        ========================= */

        function connectToServer() {

            if (socket) {
                return;
            }

            message.textContent =
                "Conectando al servidor...";

            socket =
                io(window.location.origin);


            socket.on(
                "connect",
                () => {

                    message.textContent =
                        "🟢 Conectado al servidor.";

                }
            );


            socket.on(
                "roomCreated",
                (data) => {

                    roomCode =
                        data.code;

                    myPlayer =
                        data.player;

                    myName =
                        data.name;

                    roomCodeElement.textContent =
                        roomCode;

                    roomCodeBox.style.display =
                        "block";

                    menu.style.display =
                        "none";

                    game.style.display =
                        "flex";

                    waiting.style.display =
                        "flex";

                    waitingText.textContent =
                        `Compartí el código ${roomCode} con tu oponente.`;

                    enableTouchControls();

                    updateNames();

                }
            );


            socket.on(
                "roomJoined",
                (data) => {

                    roomCode =
                        data.code;

                    myPlayer =
                        data.player;

                    myName =
                        data.name;

                    menu.style.display =
                        "none";

                    game.style.display =
                        "flex";

                    waiting.style.display =
                        "flex";

                    waitingText.textContent =
                        "Esperando que comience la partida...";

                    enableTouchControls();

                    updateNames();

                }
            );


            socket.on(
                "roomNotFound",
                () => {

                    message.textContent =
                        "❌ No existe esa partida.";

                    socket.disconnect();

                    socket = null;

                }
            );


            socket.on(
                "roomFull",
                () => {

                    message.textContent =
                        "❌ Esa partida ya está completa.";

                    socket.disconnect();

                    socket = null;

                }
            );


            socket.on(
                "playersUpdate",
                (players) => {

                    if (isBotMode) return;

                    state =
                        players;

                    updateNames();

                    if (
                        players.player1 &&
                        players.player2
                    ) {

                        waiting.style.display =
                            "none";

                    } else {

                        waiting.style.display =
                            "flex";

                    }

                }
            );


            socket.on(
                "gameState",
                (newState) => {

                    if (isBotMode) return;

                    state =
                        newState;

                    updateScore();
                    updateNames();

                }
            );


            socket.on(
                "gameOver",
                (data) => {

                    if (isBotMode) return;

                    gameOver.style.display =
                        "flex";

                    if (
                        data.winner ===
                        myPlayer
                    ) {

                        winnerText.textContent =
                            "🏆 ¡GANASTE!";

                    } else {

                        winnerText.textContent =
                            "💀 PERDISTE";

                    }

                    setTimeout(
                        () => {

                            gameOver.style.display =
                                "none";

                        },
                        3000
                    );

                }
            );


            socket.on(
                "roomDisconnected",
                () => {

                    if (isBotMode) return;

                    waiting.style.display =
                        "flex";

                    waitingText.textContent =
                        "El otro jugador se desconectó.";

                }
            );


            socket.on(
                "connect_error",
                () => {

                    message.textContent =
                        "❌ No se pudo conectar al servidor.";

                }
            );

        }


        /* =========================
           MODO BOT (LOCAL)
        ========================= */

        botButton.addEventListener("click", () => {

            const name = nameInput.value.trim() || "JUGADOR";

            isBotMode = true;
            myPlayer = 1;

            state.name1 = name;
            state.name2 = "BOT 🤖";
            state.running = true;
            state.score1 = 0;
            state.score2 = 0;
            state.paddle1Y = 200;
            state.paddle2Y = 200;
            state.ballX = 400;
            state.ballY = 250;

            menu.style.display = "none";
            game.style.display = "flex";
            waiting.style.display = "none";

            enableTouchControls();
            updateNames();
            updateScore();
        });

        function resetBallLocal() {
            state.ballX = 400;
            state.ballY = 250;
            state.ballDX = (Math.random() > 0.5 ? 1 : -1) * 6;
            state.ballDY = (Math.random() * 6 - 3);
        }

        function updateBotGame() {
            if (!isBotMode || !state.running) return;

            // Movimiento de la pelota
            state.ballX += state.ballDX;
            state.ballY += state.ballDY;

            // Rebotes superior e inferior
            if (state.ballY <= 10 || state.ballY >= 490) {
                state.ballDY *= -1;
            }

            // Lógica IA del BOT (Paleta derecha)
            const paddleCenter = state.paddle2Y + 50;
            if (paddleCenter < state.ballY - 10) {
                state.paddle2Y += 4.5;
            } else if (paddleCenter > state.ballY + 10) {
                state.paddle2Y -= 4.5;
            }
            state.paddle2Y = Math.max(0, Math.min(400, state.paddle2Y));

            // Colisión Paleta 1 (Jugador)
            if (state.ballX <= 35 && state.ballY >= state.paddle1Y && state.ballY <= state.paddle1Y + 100) {
                state.ballDX = Math.abs(state.ballDX) + 0.3;
                state.ballDY += (state.ballY - (state.paddle1Y + 50)) * 0.1;
            }

            // Colisión Paleta 2 (Bot)
            if (state.ballX >= 765 && state.ballY >= state.paddle2Y && state.ballY <= state.paddle2Y + 100) {
                state.ballDX = -Math.abs(state.ballDX) - 0.3;
                state.ballDY += (state.ballY - (state.paddle2Y + 50)) * 0.1;
            }

            // Puntos
            if (state.ballX < 0) {
                state.score2++;
                updateScore();
                resetBallLocal();
            }
            if (state.ballX > 800) {
                state.score1++;
                updateScore();
                resetBallLocal();
            }
        }


        /* =========================
           CREAR PARTIDA
        ========================= */

        createButton.addEventListener(
            "click",
            () => {

                const name =
                    nameInput.value.trim();

                if (!name) {

                    message.textContent =
                        "⚠️ Escribí tu nombre.";

                    nameInput.focus();

                    return;

                }

                connectToServer();

                setTimeout(
                    () => {

                        if (socket) {

                            socket.emit(
                                "createRoom",
                                name
                            );

                        }

                    },
                    300
                );

            }
        );


        /* =========================
           UNIRSE
        ========================= */

        joinButton.addEventListener(
            "click",
            () => {

                const name =
                    nameInput.value.trim();

                const code =
                    codeInput.value
                        .trim()
                        .toUpperCase();

                if (!name) {

                    message.textContent =
                        "⚠️ Escribí tu nombre.";

                    nameInput.focus();

                    return;

                }

                if (
                    code.length !== 4
                ) {

                    message.textContent =
                        "⚠️ Escribí un código de 4 caracteres.";

                    codeInput.focus();

                    return;

                }

                connectToServer();

                setTimeout(
                    () => {

                        if (socket) {

                            socket.emit(
                                "joinRoom",
                                {
                                    code,
                                    name
                                }
                            );

                        }

                    },
                    300
                );

            }
        );


        /* =========================
           COPIAR CÓDIGO
        ========================= */

        copyButton.addEventListener(
            "click",
            async () => {

                if (!roomCode) {
                    return;
                }

                try {

                    await navigator.clipboard.writeText(
                        roomCode
                    );

                    copyButton.textContent =
                        "✅ COPIADO";

                    setTimeout(
                        () => {

                            copyButton.textContent =
                                "📋 COPIAR CÓDIGO";

                        },
                        1500
                    );

                } catch {

                    message.textContent =
                        `Código: ${roomCode}`;

                }

            }
        );


        /* =========================
           NOMBRES
        ========================= */

        function updateNames() {

            player1Name.textContent =
                state.name1 ||
                "JUGADOR 1";

            player2Name.textContent =
                state.name2 ||
                "JUGADOR 2";

        }


        /* =========================
           MARCADOR
        ========================= */

        function updateScore() {

            scoreElement.textContent =
                `${state.score1} — ${state.score2}`;

        }


        /* =========================
           MOVIMIENTO
        ========================= */

        function move(direction) {

            if (isBotMode) {
                const speed = 25;
                if (direction === "up") {
                    state.paddle1Y = Math.max(0, state.paddle1Y - speed);
                } else if (direction === "down") {
                    state.paddle1Y = Math.min(400, state.paddle1Y + speed);
                }
                return;
            }

            if (
                !socket ||
                !myPlayer
            ) {
                return;
            }

            socket.emit(
                "move",
                direction
            );

        }


        /* =========================
           TECLADO
        ========================= */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    myPlayer === 1 || isBotMode
                ) {

                    if (
                        event.key === "w" ||
                        event.key === "W" ||
                        event.key === "ArrowUp"
                    ) {

                        event.preventDefault();
                        move("up");

                    }

                    if (
                        event.key === "s" ||
                        event.key === "S" ||
                        event.key === "ArrowDown"
                    ) {

                        event.preventDefault();
                        move("down");

                    }

                }

                if (
                    myPlayer === 2 && !isBotMode
                ) {

                    if (
                        event.key === "ArrowUp"
                    ) {

                        event.preventDefault();
                        move("up");

                    }

                    if (
                        event.key === "ArrowDown"
                    ) {

                        event.preventDefault();
                        move("down");

                    }

                }

            }
        );


        /* =========================
           CONTROLES TÁCTILES
        ========================= */

        function setupTouch(element) {

            let lastY = null;

            element.addEventListener(
                "pointerdown",
                (event) => {

                    lastY =
                        event.clientY;

                    element.setPointerCapture(
                        event.pointerId
                    );

                }
            );


            element.addEventListener(
                "pointermove",
                (event) => {

                    if (
                        lastY === null
                    ) {
                        return;
                    }

                    const difference =
                        event.clientY -
                        lastY;

                    if (
                        Math.abs(difference) < 5
                    ) {
                        return;
                    }

                    if (
                        difference < 0
                    ) {

                        move("up");

                    } else {

                        move("down");

                    }

                    lastY =
                        event.clientY;

                }
            );


            element.addEventListener(
                "pointerup",
                () => {

                    lastY = null;

                }
            );


            element.addEventListener(
                "pointercancel",
                () => {

                    lastY = null;

                }
            );

        }


        setupTouch(touchLeft);
        setupTouch(touchRight);


        /* =========================
           DIBUJAR
        ========================= */

        function draw() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "#05070c";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* Línea central */

            ctx.strokeStyle =
                "rgba(255,255,255,.12)";

            ctx.setLineDash(
                [10,15]
            );

            ctx.beginPath();

            ctx.moveTo(
                canvas.width / 2,
                0
            );

            ctx.lineTo(
                canvas.width / 2,
                canvas.height
            );

            ctx.stroke();

            ctx.setLineDash([]);


            /* Paleta 1 */

            drawPaddle(
                20,
                state.paddle1Y,
                "#00e5ff"
            );


            /* Paleta 2 */

            drawPaddle(
                canvas.width - 35,
                state.paddle2Y,
                "#ff4081"
            );


            /* Pelota */

            ctx.shadowColor =
                "#ffffff";

            ctx.shadowBlur =
                20;

            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                state.ballX,
                state.ballY,
                10,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.shadowBlur = 0;

        }


        /* =========================
           PALETA
        ========================= */

        function drawPaddle(
            x,
            y,
            color
        ) {

            ctx.shadowColor =
                color;

            ctx.shadowBlur =
                18;

            ctx.fillStyle =
                color;

            ctx.beginPath();

            ctx.roundRect(
                x,
                y,
                15,
                100,
                8
            );

            ctx.fill();

            ctx.shadowBlur = 0;

        }


        /* =========================
           ANIMACIÓN
        ========================= */

        function animationLoop() {

            updateBotGame();
            draw();

            requestAnimationFrame(
                animationLoop
            );

        }

        animationLoop();

    </script>

</body>
